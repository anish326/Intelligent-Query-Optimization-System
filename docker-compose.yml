services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: queryopt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d queryopt"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/queryopt
      DATABASE_URL: postgresql://query_reader:query_reader@postgres:5432/queryopt
      MODEL_PATH: /app/data/runtime_model.joblib
    ports: ["8000:8000"]
    volumes: ["./backend:/app", "model_data:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
  model_data:
